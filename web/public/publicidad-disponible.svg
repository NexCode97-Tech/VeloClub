<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="presentation" aria-hidden="true">
  <!-- Solo el ambiente: el brillo y los aros. El ícono y los textos los pone la
       tarjeta en HTML, no este archivo.

       El motivo es la tipografía. Un SVG cargado con <img> no hereda las
       fuentes de la página, así que el texto que viviera aquí nunca se vería
       en Geist: caía al sans de cada sistema y la pieza cambiaba de un
       computador a otro. En HTML hereda la del proyecto y de paso el título se
       lee nítido en cualquier pantalla, sin depender del escalado.

       Sin fondo propio: el color lo pone la tarjeta que lo contiene, para que
       el mismo dibujo sirva en los distintos cupos sin duplicar el archivo. -->
  <defs>
    <radialGradient id="brillo" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#brillo)"/>

  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" fill="none">
    <circle cx="1010" cy="720" r="150"/>
    <circle cx="1010" cy="720" r="250"/>
    <circle cx="190" cy="180" r="120"/>
  </g>
</svg>
